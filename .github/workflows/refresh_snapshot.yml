name: Refresh ETF App Snapshot

on:
  repository_dispatch:
    types: [sheets-updated]

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-etf-app-snapshot
  cancel-in-progress: false

jobs:
  refresh_snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Notify Discord - 開始更新
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -n "$DISCORD_WEBHOOK" ]; then
            curl -sS -X POST "$DISCORD_WEBHOOK" \
              -H "Content-Type: application/json" \
              -d '{"content":"🚀 ETF 網頁快照開始更新\n來源：refresh_app_snapshot.py"}'
          fi

      - name: Checkout Web project
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install gspread google-auth requests pandas numpy streamlit

      - name: Prepare Streamlit runtime secrets
        run: |
          mkdir -p .streamlit

          cat > .streamlit/secrets.toml <<'EOF'
          GOOGLE_SPREADSHEET_ID = ""
          GEMINI_MODEL = "gemini-3.8-flash"
          EOF

      - name: Check required secrets
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          if [ -z "$GOOGLE_CREDENTIALS" ]; then
            echo "錯誤：缺少 GOOGLE_CREDENTIALS"
            exit 1
          fi

      - name: Check required files
        run: |
          test -f app.py
          test -f refresh_app_snapshot.py
          test -f requirements.txt

      - name: Generate app snapshot
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          python -u refresh_app_snapshot.py

      - name: Compress app snapshot
        run: |
          python - <<'PY'
          import gzip
          from pathlib import Path

          source = Path("app_snapshot.json")
          target = Path("app_snapshot.json.gz")

          if not source.exists():
              raise SystemExit("找不到 app_snapshot.json")

          with source.open("rb") as source_file:
              with gzip.open(
                  target,
                  "wb",
                  compresslevel=9,
              ) as target_file:
                  target_file.writelines(source_file)

          source.unlink()

          size_mb = target.stat().st_size / 1024 / 1024
          print(f"壓縮後大小：{size_mb:.2f} MB")

          if target.stat().st_size >= 100 * 1024 * 1024:
              raise SystemExit(
                  "壓縮後仍超過 GitHub 100 MB 限制"
              )
          PY

      - name: Validate compressed snapshot
        run: |
          python - <<'PY'
          import gzip
          import json
          from pathlib import Path

          path = Path("app_snapshot.json.gz")

          if not path.exists():
              raise SystemExit(
                  "找不到 app_snapshot.json.gz"
              )

          with gzip.open(
              path,
              "rt",
              encoding="utf-8",
          ) as file:
              data = json.load(file)

          required = [
              "updated_at",
              "json_data",
              "twse_live_market",
              "ticker_map",
              "etf_name_map",
              "price_history",
              "crawler",
              "gemini_insight",
              "gemini_by_etf",
          ]

          missing = [
              key for key in required
              if key not in data
          ]

          if missing:
              raise SystemExit(
                  f"快照缺少欄位：{missing}"
              )

          history = json.loads(data["json_data"])

          if not isinstance(history, list):
              raise SystemExit(
                  "json_data 必須是 list"
              )

          if len(history) == 0:
              raise SystemExit(
                  "ETF History 沒有資料，拒絕提交空白快照"
              )

          crawler_keys = [
              "discount",
              "dividend",
              "institutional",
              "shares_flow",
          ]

          missing_crawler = [
              key for key in crawler_keys
              if key not in data["crawler"]
          ]

          if missing_crawler:
              raise SystemExit(
                  f"crawler 缺少資料：{missing_crawler}"
              )

          print("app_snapshot.json.gz 驗證成功")
          print("更新時間：", data["updated_at"])
          print("ETF History 筆數：", len(history))
          print(
              "Gemini 單檔摘要數：",
              len(data["gemini_by_etf"]),
          )
          PY

      - name: Commit app snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f "app_snapshot.json.gz" ]; then
            git add app_snapshot.json.gz
          else
            echo "找不到 app_snapshot.json.gz"
            exit 1
          fi

          git add -u

          if git diff --cached --quiet; then
            echo "app_snapshot.json.gz 沒有變化"
          else
            git commit -m "Refresh ETF app snapshot"
            git push
          fi

      - name: Notify Discord - 更新成功
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -n "$DISCORD_WEBHOOK" ]; then
            curl -sS -X POST "$DISCORD_WEBHOOK" \
              -H "Content-Type: application/json" \
              -d '{"content":"✅ ETF 網頁快照更新完成\napp_snapshot.json.gz 已產生並提交"}'
          fi

      - name: Notify Discord - 更新失敗
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -n "$DISCORD_WEBHOOK" ]; then
            curl -sS -X POST "$DISCORD_WEBHOOK" \
              -H "Content-Type: application/json" \
              -d '{"content":"❌ ETF 網頁快照更新失敗\n請查看 GitHub Actions 執行紀錄"}'
          fi
